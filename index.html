<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Space Invaders - Emulador</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: Consolas, "Courier New", monospace;
				background: #101410;
				color: #b7e78c;
			}
			body {
				min-height: 100vh;
				margin: 0;
				display: grid;
				place-items: center;
			}
			main { text-align: center; padding: 24px; }
			h1 { font-size: 1.25rem; font-weight: 400; letter-spacing: 0.15em; }
			canvas {
				display: block;
				width: min(448px, 80vw);
				height: min(512px, 80vh);
				margin: 24px auto;
				border: 2px solid #526344;
				background: #000;
				image-rendering: pixelated;
			}
			p { max-width: 34rem; color: #a7ad9e; font-size: 0.9rem; line-height: 1.5; }
			code { color: #d1f4ad; }
			button {
				padding: 10px 18px;
				border: 1px solid #526344;
				background: #1a2118;
				color: #d1f4ad;
				font: inherit;
				cursor: pointer;
			}
			button:disabled { cursor: wait; opacity: 0.7; }
		</style>
	</head>
	<body>
		<main>
			<h1>SPACE INVADERS</h1>
			<button id="load-rom" type="button">Carregar arquivos da ROM</button>
			<input id="rom-files" type="file" accept=".h,.g,.f,.e" multiple hidden />
			<p id="status" role="status" aria-live="polite">Selecione invaders.h, invaders.g, invaders.f e invaders.e.</p>
			<canvas id="screen" aria-label="Tela do Space Invaders"></canvas>
		</main>
		<script type="module" src="/dist/main.js"></script>
	</body>
</html>
